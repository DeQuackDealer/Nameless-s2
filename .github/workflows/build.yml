name: Build Plugin

on:
  push:
    branches: [ main, master, season-2 ]
  pull_request:
    branches: [ main, master, season-2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      - name: Upload Nameless_Pack.jar
        uses: actions/upload-artifact@v4
        with:
          name: Nameless_Pack
          path: target/Nameless_Pack.jar
          retention-days: 90
          if-no-files-found: error